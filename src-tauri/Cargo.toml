[package]
name = "hurricane-party"
version = "0.6.0"
description = "Offline-first media library and player."
authors = ["paperhurts"]
edition = "2021"
# The real floor is set by lofty 0.25 (rust-version 1.89). Declaring it here
# turns a too-old toolchain into one clear message instead of an E0599 deep
# in bond.rs. The compiler actually used is pinned by rust-toolchain.toml.
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hurricane_party_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
thiserror = "2"
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util"] }
lofty = "0.25"
walkdir = "2"
tauri-plugin-dialog = "2"
# A `.wsz` is a zip (D6, D17). Deflate and stored only: a skin is BMPs and two
# text files, and the exotic compression methods are attack surface for art.
zip = { version = "2", default-features = false, features = ["deflate"] }
hp-control = { path = "../crates/hp-control" }
# The Cone theme's radar and alerts (#85, D135), and nothing else: every
# request goes through egress.rs. Tauri already builds reqwest; this turns on
# TLS, as Windows' own (SChannel) rather than the default rustls, whose
# aws-lc-rs backend wants CMake and NASM on the build machine.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Redrawing the radar frames in the analyser's ramp. Already in the tree.
png = "0.18"
# A smart playlist's words match the way the library's search box does,
# blind to case and accents (#165, D144): NFD, then every mark dropped, the
# same steps as `fold` in the webview. ICU4X, already in the tree through
# `url`'s host names, with the same data it builds there.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }
# Fingerprinting a file so damage can be told from a retag (#164, D142).
# Already in the tree through Tauri's own dependencies.
sha2 = "0.10"

# D44: the entire platform surface of the window engine is six calls, all of
# them behind the `platform` trait. Ownership (D41), the forcing SetWindowPos
# (D42), the startup DPI assertion (D37), and display-change rescue (D57).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  # Watching the library roots (#111, D137): ReadDirectoryChangesW on a
  # folder, and hearing an eject so the watch lets go of the drive.
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  # Asking a drive for its volume without the "no disk" box (D143).
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Warnings are errors everywhere this crate compiles: cargo build, cargo test,
# cargo clippy, rust-analyzer. This is what keeps /land and CI honest with each
# other without a flag anyone has to remember. New lints arrive only when
# rust-toolchain.toml is bumped, on purpose.
[lints.rust]
warnings = "deny"
