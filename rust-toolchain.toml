# One compiler everywhere. Warnings are errors in both crates ([lints] in each
# Cargo.toml), so a Rust release that adds a lint must not be able to turn main
# red on its own: it arrives when this pin is bumped, in a PR whose only job is
# to absorb the new lints. rustup installs this toolchain on first use, and CI
# runs `rustup show` to do the same.
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
