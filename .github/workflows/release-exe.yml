# The shipping exe, built on demand. Not part of the PR gate: it fetches the
# three pinned sidecars (~230 MB; D46, D47, D48) and takes several minutes.
#
# Run it from the Actions tab (workflow_dispatch) when a merged build is wanted
# on another machine, or push a v* tag. The artifact is the exe plus the three
# sidecars Tauri copies beside it: unzip anywhere and run. Windows 11 already
# ships the WebView2 runtime. Artifacts expire after 14 days to keep the private
# repo's storage small; re-run the workflow for a fresh one.
name: release-exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Creating the Release needs write on contents; everything else reads.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Fetch the pinned sidecars
        shell: pwsh
        run: ./tools/fetch-sidecars.ps1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pnpm
        run: npm install -g pnpm@9
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build (no installer)
        run: pnpm tauri build --no-bundle

      - name: Collect the exe and its sidecars
        run: |
          mkdir -p out
          cp src-tauri/target/release/*.exe out/
          ls -la out

      # An artifact name may not contain a slash, and every branch here has
      # one (chore/61-…). Tags and main never did, which is why a manual run
      # on a branch was the first to hit it.
      - name: Artifact name without slashes
        run: echo "SAFE_REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: hurricane-party-${{ env.SAFE_REF }}-${{ github.sha }}
          path: out/
          retention-days: 14

      # A tag is a release (#66): the same zip, under a name that never
      # changes, attached to a GitHub Release so releases/latest/download/…
      # is a permanent link that needs no login. The notes are the tag's
      # annotation, then the two lines a stranger needs.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && 7z a -tzip ../hurricane-party-windows.zip . > /dev/null)
          ls -la hurricane-party-windows.zip
          {
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^$/d'
            echo
            echo '**To run it:** unzip anywhere and start `hurricane-party.exe`. No installer. Windows 11 already has the WebView2 runtime it needs.'
            echo
            echo 'The first time, Windows shows "Windows protected your PC": the exe is not code-signed. Click **More info**, then **Run anyway**. It asks once.'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" hurricane-party-windows.zip \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
