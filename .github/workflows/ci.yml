# Gates on every pull request and on main. Windows only: this is a Windows-first
# project (O7) and the platform layer does not compile anywhere else.
#
# These are exactly the gates /land runs locally, and they agree by construction:
# warnings are errors through [lints] in each Cargo.toml, and the compiler is
# pinned by rust-toolchain.toml, so nothing here carries a flag the skills lack.
#
# There is no Tauri build here: the three sidecars are 230 MB and gitignored,
# and tauri-build only checks that each bundle.externalBin path exists before
# copying it, so zero-byte stand-ins are enough to compile and run the tests.
# The shipping exe is a separate, on-demand workflow: release-exe.yml.
name: checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Stub the sidecars so tauri-build can run
        run: |
          mkdir -p src-tauri/binaries
          for t in yt-dlp deno ffmpeg; do : > "src-tauri/binaries/$t-x86_64-pc-windows-msvc.exe"; done

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show
          cargo --version
          cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            crates/hp-control/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'crates/hp-control/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: rustfmt (app)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: rustfmt (hp-control)
        run: cargo fmt --manifest-path crates/hp-control/Cargo.toml --check

      # Warnings are errors via [lints]; --all-targets includes the test modules.
      # hp-control gets its own step: as a path dependency of the app it is
      # compiled with lints capped, so the app's clippy run never lints it.
      - name: clippy (app)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - name: clippy (hp-control)
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path crates/hp-control/Cargo.toml --all-targets

      # Still run after a lint failure, so one push answers both questions.
      - name: cargo test (app)
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: cargo test (hp-control)
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path crates/hp-control/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm
        run: npm install -g pnpm@9
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: svelte-check + tsc
        run: pnpm check
