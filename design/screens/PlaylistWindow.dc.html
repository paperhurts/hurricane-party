<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isShade }}" hint-placeholder-val="{{ false }}">
  <div style="width:275px;height:14px;box-sizing:border-box;display:flex;align-items:center;gap:5px;padding:0 3px;background:linear-gradient(#15112a,#0C0A14);border:1px solid rgba(111,227,255,0.30);font:400 8px/1 Iosevka,'Iosevka Web',ui-monospace,'DejaVu Sans Mono',monospace;color:#E8F4FF;overflow:hidden">
    <span style="font-size:6px;letter-spacing:1.2px;color:rgba(232,244,255,0.5)">PL</span>
    <span style="flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8px;color:#FF4FD8;text-shadow:0 0 5px rgba(255,79,216,0.45)">{{ currentLine }}</span>
    <span style="font-size:6px;color:rgba(232,244,255,0.45)">{{ countLabel }}</span>
    <div onClick="{{ unshade }}" style="width:9px;height:9px;display:grid;place-items:center;background:#100D1C;box-shadow:inset 0 0 0 1px rgba(111,227,255,0.28);color:#9fd8ef;font-size:6px;cursor:pointer" style-hover="color:#6FE3FF;box-shadow:inset 0 0 0 1px #6FE3FF">▢</div>
  </div>
</sc-if>
<sc-if value="{{ isFull }}" hint-placeholder-val="{{ true }}">
<div style="width:275px;box-sizing:border-box;background:#0C0A14;border:1px solid rgba(111,227,255,0.30);font:400 11px/1 Iosevka,'Iosevka Web',ui-monospace,'DejaVu Sans Mono',monospace;color:#E8F4FF;display:flex;flex-direction:column;overflow:hidden;height: {{ h }}px">
  <div style="height:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 3px;background:linear-gradient(#15112a,#0C0A14);border-bottom:1px solid rgba(111,227,255,0.16)">
    <div style="display:flex;align-items:center;gap:4px;font-size:6px;letter-spacing:1.4px;text-transform:uppercase;color: {{ chromeInk }}">
      <div style="width:3px;height:3px;background: {{ lampColor }};box-shadow:0 0 4px {{ lampColor }}"></div>
      <span>Playlist — Hurricane Kit</span>
    </div>
    <div style="display:flex;gap:2px">
      <div onClick="{{ shadeOn }}" style="width:9px;height:9px;display:grid;place-items:center;background:#100D1C;box-shadow:inset 0 0 0 1px rgba(111,227,255,0.24);font-size:6px;color:#9fd8ef;cursor:pointer" style-hover="color:#6FE3FF;box-shadow:inset 0 0 0 1px #6FE3FF">─</div>
      <div style="width:9px;height:9px;display:grid;place-items:center;background:#100D1C;box-shadow:inset 0 0 0 1px rgba(111,227,255,0.24);font-size:6px;color:#9fd8ef;cursor:pointer" style-hover="color:#FF4FD8;box-shadow:inset 0 0 0 1px #FF4FD8">×</div>
    </div>
  </div>

  <div style="flex:1 1 auto;display:flex;background:#05040A;box-shadow:inset 0 0 0 1px rgba(111,227,255,0.12);margin:2px;min-height:0">
    <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1 1 auto;min-width:0;overflow:hidden;padding:1px 0">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
          <div onClick="{{ r.select }}" style="height:10px;display:flex;align-items:center;gap:4px;padding:0 3px;cursor:default;font-size:9px;letter-spacing:0.1px;background: {{ r.bg }};color: {{ r.ink }};text-shadow: {{ r.glow }}">
            <span style="flex:0 0 auto;width:11px;text-align:right;opacity:0.6">{{ r.n }}</span>
            <span style="flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.title }}</span>
            <span style="flex:0 0 auto;opacity:0.75">{{ r.dur }}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:0 12px">
        <div style="font-size:9px;color:#E8F4FF;text-shadow:0 0 6px rgba(111,227,255,0.4)">Nothing saved yet.</div>
        <div style="font-size:7px;line-height:9px;color:rgba(232,244,255,0.45)">Paste a YouTube link or drop files here to keep them on disk.</div>
        <div style="margin-top:2px;font-size:6px;letter-spacing:0.8px;padding:3px 6px;color:#6FE3FF;box-shadow:inset 0 0 0 1px #6FE3FF,0 0 8px rgba(111,227,255,0.35)">ADD LINK</div>
      </div>
    </sc-if>
    <div style="flex:0 0 auto;width:6px;padding:1px;box-sizing:border-box;background:#07060E;box-shadow:inset 1px 0 0 rgba(111,227,255,0.12)">
      <div style="width:4px;background:rgba(111,227,255,0.45);box-shadow:0 0 5px rgba(111,227,255,0.5);height: {{ thumbH }}px"></div>
    </div>
  </div>

  <div style="height:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 3px;border-top:1px solid rgba(111,227,255,0.14)">
    <div style="display:flex;gap:2px">
      <div style="height:10px;display:flex;align-items:center;padding:0 3px;font-size:6px;letter-spacing:0.6px;color:#6FE3FF;box-shadow:inset 0 0 0 1px rgba(111,227,255,0.3);cursor:pointer" style-hover="box-shadow:inset 0 0 0 1px #6FE3FF,0 0 7px rgba(111,227,255,0.35)">ADD</div>
      <div style="height:10px;display:flex;align-items:center;padding:0 3px;font-size:6px;letter-spacing:0.6px;color:rgba(232,244,255,0.6);box-shadow:inset 0 0 0 1px rgba(111,227,255,0.18);cursor:pointer" style-hover="color:#FF4FD8;box-shadow:inset 0 0 0 1px #FF4FD8">REM</div>
      <div style="height:10px;display:flex;align-items:center;padding:0 3px;font-size:6px;letter-spacing:0.6px;color:rgba(232,244,255,0.6);box-shadow:inset 0 0 0 1px rgba(111,227,255,0.18);cursor:pointer" style-hover="color:#6FE3FF;box-shadow:inset 0 0 0 1px #6FE3FF">SORT</div>
    </div>
    <div style="display:flex;gap:5px;align-items:center;font-size:6px;letter-spacing:0.5px;color:rgba(232,244,255,0.5)">
      <span style="color:#FFB347">{{ storage }}</span>
      <span>{{ countLabel }}</span>
      <span style="color:#E8F4FF">{{ total }}</span>
    </div>
  </div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:275,&quot;height&quot;:116},&quot;focused&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;shade&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:116,&quot;min&quot;:58,&quot;max&quot;:300,&quot;step&quot;:10,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;empty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:14,&quot;tsType&quot;:&quot;number&quot;},&quot;onShade&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:boolean)=&gt;void&quot;}}">
const TRACKS = [
  ['Storm (Levez Vos Skinny Fists)', '22:32'],
  ['New Grass', '9:32'],
  ['Dayvan Cowboy', '5:00'],
  ['NOAA Weather Radio — Coastal Forecast', '41:07'],
  ['An Ending (Ascent)', '4:24'],
  ['Rhubarb', '7:41'],
  ['In a Silent Way', '4:11'],
  ['Windowlicker', '6:07'],
  ['Fourth of July', '4:53'],
  ['Substitute for Love', '5:24'],
  ['Hurricane Prep Checklist — WUFT', '18:02'],
  ['Avril 14th', '2:02'],
  ['Teardrop', '5:29'],
  ['Sunset', '4:04'],
  ['Rainy Night in Georgia', '3:39']
];
class Component extends DCLogic {
  state = { selected: this.props.selected == null ? 3 : this.props.selected, current: 1 };
  renderVals() {
    const p = this.props, s = this.state;
    const h = p.h || 116;
    const focused = p.focused !== false;
    const visible = Math.max(1, Math.floor((h - 32) / 10));
    const rows = TRACKS.slice(0, visible).map((t, i) => {
      const isCur = i === s.current, isSel = i === s.selected;
      return {
        n: String(i + 1).padStart(2, '0'), title: t[0], dur: t[1],
        bg: isSel ? 'rgba(111,227,255,0.13)' : 'transparent',
        ink: isCur ? '#FF4FD8' : (isSel ? '#E8F4FF' : 'rgba(232,244,255,0.72)'),
        glow: isCur ? '0 0 6px rgba(255,79,216,0.55)' : 'none',
        select: () => this.setState({ selected: i })
      };
    });
    return {
      isShade: !!p.shade, isFull: !p.shade, h,
      rows, hasRows: !p.empty, isEmpty: !!p.empty,
      chromeInk: focused ? 'rgba(232,244,255,0.62)' : 'rgba(232,244,255,0.22)',
      lampColor: focused ? '#6FE3FF' : 'rgba(111,227,255,0.25)',
      thumbH: Math.max(6, Math.round((h - 34) * visible / TRACKS.length)),
      countLabel: p.empty ? '0 ITEMS' : TRACKS.length + ' ITEMS',
      total: p.empty ? '0:00' : '2:24:07',
      storage: p.empty ? '' : '41 GB FREE',
      currentLine: '02. New Grass',
      shadeOn: () => p.onShade && p.onShade(true),
      unshade: () => p.onShade && p.onShade(false)
    };
  }
}
</script>
</body>
</html>
