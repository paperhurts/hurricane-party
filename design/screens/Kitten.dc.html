<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @keyframes kit-bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @keyframes kit-sway { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
    @keyframes kit-hop { 0% { transform: translate(0,0) rotate(0) } 35% { transform: translate(10px,-16px) rotate(12deg) } 100% { transform: translate(20px,2px) rotate(0) } }
    @keyframes kit-breathe { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(0.94) } }
    @keyframes kit-hearts { 0% { opacity: 0; transform: translateY(0) scale(0.7) } 30% { opacity: 1 } 100% { opacity: 0; transform: translateY(-16px) scale(1.1) } }
    @keyframes kit-dangle { 0%,100% { transform: rotate(-9deg) } 50% { transform: rotate(9deg) } }
  </style>
</helmet>

<div style="position:relative;width:38px;height:32px;animation: {{ outerAnim }}">
  <sc-if value="{{ showHearts }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:24px;top:-8px;font:400 9px/1 'Comic Sans MS','Comic Neue',cursive;color:#FF5FB0;animation: {{ heartAnim }}">♥</div>
    <div style="position:absolute;left:31px;top:-2px;font:400 7px/1 'Comic Sans MS','Comic Neue',cursive;color:#FF9FD6;animation: {{ heartAnim2 }}">♥</div>
  </sc-if>
  <sc-if value="{{ showZ }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:26px;top:-4px;font:400 8px/1 'Comic Sans MS','Comic Neue',cursive;color:#A99FFF">z</div>
    <div style="position:absolute;left:32px;top:-11px;font:400 6px/1 'Comic Sans MS','Comic Neue',cursive;color:#A99FFF">z</div>
  </sc-if>
  <sc-if value="{{ showBang }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:26px;top:-11px;font:700 11px/1 'Comic Sans MS','Comic Neue',cursive;color:#FF5FB0;text-shadow:0 0 6px rgba(255,95,176,0.6)">!</div>
  </sc-if>

  <div style="position:absolute;left:2px;bottom:0;width:26px;height: {{ bodyH }}px;border-radius:50% 50% 46% 46%;background: {{ fill }};box-shadow:inset 0 -2px 0 {{ shade }}, 0 0 10px {{ glow }}, 0 1px 0 rgba(74,42,92,0.18);animation: {{ bodyAnim }}"></div>
  <div style="position:absolute;left:14px;bottom: {{ tailBottom }}px;width:14px;height:3px;border-radius:3px;background: {{ fill }};box-shadow:0 0 8px {{ glow }};transform: {{ tailTransform }};transform-origin:0 50%"></div>

  <div style="position:absolute;left: {{ headLeft }}px;top:0;width:20px;height:17px;border-radius:50% 50% 48% 48%;background: {{ fill }};box-shadow:0 0 10px {{ glow }};transform: {{ headTransform }};transform-origin:50% 100%">
    <div style="position:absolute;left:1px;top:-5px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom: {{ earH }}px solid {{ fill }}"></div>
    <div style="position:absolute;right:1px;top:-5px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom: {{ earH }}px solid {{ fill }}"></div>
    <div style="position:absolute;left:4px;top:7px;width: {{ eyeW }}px;height: {{ eyeH }}px;border-radius: {{ eyeRadius }};background:#4A2A5C"></div>
    <div style="position:absolute;right:4px;top:7px;width: {{ eyeW }}px;height: {{ eyeH }}px;border-radius: {{ eyeRadius }};background:#4A2A5C"></div>
    <div style="position:absolute;left:9px;top:11px;width:2px;height:2px;border-radius:2px;background:#FF5FB0"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:80,&quot;height&quot;:70},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;sleep&quot;,&quot;dance&quot;,&quot;walk&quot;,&quot;startle&quot;,&quot;pet&quot;,&quot;carry&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hue&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:325,&quot;min&quot;:0,&quot;max&quot;:360,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state || 'idle';
    const hue = this.props.hue == null ? 325 : this.props.hue;
    const reduced = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const a = (s) => reduced ? 'none' : s;
    const asleep = st === 'sleep', dance = st === 'dance', startle = st === 'startle', pet = st === 'pet', carry = st === 'carry', walk = st === 'walk';
    return {
      fill: 'hsl(' + hue + ',95%,80%)',
      shade: 'hsla(' + hue + ',80%,64%,0.55)',
      glow: 'hsla(' + hue + ',95%,72%,0.55)',
      bodyH: asleep ? 13 : 18,
      headLeft: asleep ? 16 : (carry ? 8 : 9),
      bodyAnim: asleep ? a('kit-breathe 3.4s ease-in-out infinite') : 'none',
      outerAnim: dance ? a('kit-bounce 0.5s ease-in-out infinite')
        : walk ? a('kit-sway 1.6s ease-in-out infinite')
        : startle ? a('kit-hop 420ms ease-out 1 both')
        : carry ? a('kit-dangle 1.1s ease-in-out infinite')
        : 'none',
      headTransform: asleep ? 'rotate(-14deg)' : (dance ? 'rotate(6deg)' : (startle ? 'translateY(-2px)' : (carry ? 'rotate(-8deg)' : 'none'))),
      tailTransform: asleep ? 'rotate(-8deg)' : (startle ? 'rotate(-58deg)' : (dance ? 'rotate(-34deg)' : (walk ? 'rotate(-24deg)' : 'rotate(-14deg)'))),
      tailBottom: asleep ? 3 : 10,
      earH: startle ? 9 : 7,
      eyeW: asleep || pet ? 4 : (startle ? 4 : 3),
      eyeH: asleep || pet ? 1 : (startle ? 5 : 3),
      eyeRadius: asleep || pet ? '1px' : '50%',
      showHearts: pet, showZ: asleep, showBang: startle || carry,
      heartAnim: a('kit-hearts 1.4s ease-out infinite'),
      heartAnim2: a('kit-hearts 1.4s ease-out 0.5s infinite')
    };
  }
}
</script>
</body>
</html>
