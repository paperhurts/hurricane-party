<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;overflow:hidden;background: {{ base }}">
  <sc-if value="{{ hasRadar }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;filter: {{ radarFilter }}">
      <div style="position:absolute;inset:0;filter:blur(7px)">
        <div style="position:absolute;left:-14%;top:14%;width:78%;height:70%;background:radial-gradient(ellipse at 50% 50%,rgba(31,166,55,0.62),rgba(19,112,42,0.34) 52%,rgba(10,58,22,0) 74%);transform:rotate(-24deg)"></div>
        <div style="position:absolute;left:6%;top:30%;width:56%;height:44%;background:radial-gradient(ellipse at 50% 50%,rgba(168,214,43,0.55),rgba(87,194,43,0.3) 55%,rgba(19,112,42,0) 78%);transform:rotate(-32deg)"></div>
        <div style="position:absolute;left:20%;top:40%;width:38%;height:28%;background:radial-gradient(ellipse at 50% 50%,rgba(232,208,33,0.6),rgba(255,168,43,0.34) 50%,rgba(168,214,43,0) 80%);transform:rotate(-38deg)"></div>
        <div style="position:absolute;left:30%;top:47%;width:22%;height:16%;background:radial-gradient(ellipse at 50% 50%,rgba(255,59,47,0.62),rgba(224,27,60,0.32) 52%,rgba(255,122,31,0) 82%);transform:rotate(-40deg)"></div>
        <div style="position:absolute;left:36%;top:51%;width:10%;height:7%;background:radial-gradient(ellipse at 50% 50%,rgba(255,233,251,0.7),rgba(255,79,216,0.45) 45%,rgba(224,27,60,0) 85%)"></div>
        <div style="position:absolute;left:44%;top:6%;width:62%;height:52%;background:radial-gradient(ellipse at 50% 50%,rgba(31,166,55,0.4),rgba(19,112,42,0.2) 55%,rgba(10,58,22,0) 80%);transform:rotate(18deg)"></div>
        <div style="position:absolute;left:56%;top:58%;width:52%;height:46%;background:radial-gradient(ellipse at 50% 50%,rgba(87,194,43,0.36),rgba(19,112,42,0.18) 58%,rgba(10,58,22,0) 82%);transform:rotate(8deg)"></div>
        <div style="position:absolute;left:-6%;top:-16%;width:44%;height:40%;background:radial-gradient(ellipse at 50% 50%,rgba(19,112,42,0.34),rgba(10,58,22,0) 72%)"></div>
      </div>

      <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(111,227,255,0.055) 0 1px,transparent 1px 56px),repeating-linear-gradient(90deg,rgba(111,227,255,0.055) 0 1px,transparent 1px 56px)"></div>
      <div style="position:absolute;left:38%;top:52%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(111,227,255,0.10)"></div>
      <div style="position:absolute;left:38%;top:52%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(111,227,255,0.08)"></div>
      <div style="position:absolute;left:38%;top:52%;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(111,227,255,0.06)"></div>
      <div style="position:absolute;left:38%;top:52%;width:7px;height:7px;margin:-3px 0 0 -3px;background:#FFE9FB;box-shadow:0 0 10px rgba(255,79,216,0.8)"></div>
    </div>

    <div style="position:absolute;left:0;top:0;right:0;bottom:0;clip-path:polygon(38% 52%,104% -12%,104% 74%);background:rgba(255,179,71,0.07);box-shadow:inset 0 0 0 1px rgba(255,179,71,0.16)"></div>
    <div style="position:absolute;right:10px;top:10px;padding:3px 7px;background:rgba(5,4,10,0.72);box-shadow:inset 0 0 0 1px {{ tagRing }};font:400 9px/1 'Iosevka Web',ui-monospace,monospace;letter-spacing:1.1px;color: {{ tagInk }}">{{ tag }}</div>
  </sc-if>

  <sc-if value="{{ noRadar }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:#0C0A14"></div>
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(111,227,255,0.03) 0 1px,transparent 1px 56px),repeating-linear-gradient(90deg,rgba(111,227,255,0.03) 0 1px,transparent 1px 56px)"></div>
    <div style="position:absolute;right:10px;top:10px;padding:3px 7px;box-shadow:inset 0 0 0 1px rgba(111,227,255,0.16);font:400 9px/1 'Iosevka Web',ui-monospace,monospace;letter-spacing:1.1px;color:rgba(232,244,255,0.35)">EYEWALL · NO RADAR CACHE</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:520},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;stale&quot;,&quot;nodata&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode || 'live';
    const stale = mode === 'stale', none = mode === 'nodata';
    return {
      hasRadar: !none, noRadar: none,
      base: '#05040A',
      radarFilter: stale ? 'grayscale(0.82) brightness(0.5) contrast(0.92)' : 'none',
      tag: stale ? 'CACHED 14:32 EDT · 4h 12m OLD' : 'KJAX · BASE REFLECTIVITY · 18:44 EDT',
      tagInk: stale ? '#FFB347' : '#6FE3FF',
      tagRing: stale ? 'rgba(255,179,71,0.45)' : 'rgba(111,227,255,0.3)'
    };
  }
}
</script>
</body>
</html>
